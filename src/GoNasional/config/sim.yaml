# Overrides for the Webots simulation (aroc_sim_bridge, world:=field).
/**:
  ros__parameters:
    field:
      goal_width: 1.6             # RobotstadiumSoccerField posts at y = +-0.8 m
      penalty_mark_distance: 1.3
    camera:
      hfov_deg: 78.0              # Camera fieldOfView 1.3613 rad in RobotisOp3.proto
      source_width: 640           # 16:9 like the C920, squashed to 450x337 by main_vision
      source_height: 360

motion_manager:
  ros__parameters:
    walk:
      max_x_amp: 0.020
      max_y_amp: 0.015
      max_yaw_amp: 0.26

behavior:
  ros__parameters:
    autostart: true
    reset_on_ready: none          # the Webots robot starts at start_pose, not a touchline
    striker:
      max_vx: 0.06
      max_vy: 0.03
      max_wz: 0.40
      back_vx: 0.03
